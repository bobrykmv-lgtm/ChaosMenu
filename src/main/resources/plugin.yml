name: ChaosMenu
version: 1.0.0
main: com.chaossmp.chaosmenu.ChaosMenu
api-version: '1.21'
description: Menu plugin for ChaosSMP

commands:
  menu:
    description: Открыть меню ChaosSMP
    usage: /menu
    permission: chaosmenu.menu

permissions:
  chaosmenu.menu:
    description: Разрешает открывать меню сервера
    default: true
  chaosmenu.admin:
    description: Получать обращения игроков
    default: op
    
