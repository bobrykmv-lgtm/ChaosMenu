name: Build ChaosMenu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Plugin
        run: gradle clean build --no-daemon

      - name: Verify JAR
        run: |
          JAR="build/libs/ChaosMenu-1.0.0.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -qx "plugin.yml"
          echo "Plugin JAR verification passed."

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: ChaosMenu-Artifact
          path: build/libs/ChaosMenu-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
